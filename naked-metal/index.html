<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Naked Metal Fabrication · Video Library</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta property="og:title" content="Naked Metal Fabrication · Video Library">
<meta property="og:description" content="Your videos from 508 Media Co.">
<meta property="og:image" content="https://drewreid508.github.io/deliver/naked-metal/media/the-hype-cut.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Schibsted+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Client video library: header with the client's logo, filter chips, then one grid of square thumbnails per delivery
   date (newest first). Tap a thumbnail to open the player sheet with Download. One accent per client (--accent). */
:root{
  --ink:#08090C; --panel:#12151B; --panel2:#1A1E26; --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.16);
  --fg:#F4F6F9; --fg2:#A4ACB8; --fg3:#6E7683;
  --accent:#E4CF50; --on-accent:#08090C;
  --display:'Oswald','Arial Narrow',Impact,sans-serif;
  --body:'Schibsted Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark; background:var(--ink);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--ink);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body{min-height:100vh;background-image:radial-gradient(80% 340px at 50% 0%,color-mix(in srgb,var(--accent) 14%,transparent),transparent 75%);background-repeat:no-repeat}
h1,h2,p{margin:0}
a{color:inherit;text-decoration:none}
button{font:inherit}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));
  padding-block:24px 48px;display:flex;flex-direction:column;gap:36px}

/* top bar */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.mark{display:inline-flex;align-items:center;gap:7px;font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:.02em}
.mark s{text-decoration:none;font-weight:600;color:transparent;-webkit-text-stroke:1px var(--fg)}
.mark i{width:5px;height:5px;border-radius:50%;background:var(--accent)}
.dlall{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:14px;color:var(--on-accent);background:var(--accent);border-radius:999px;padding:9px 16px;white-space:nowrap}
.dlall:focus-visible,.btn:focus-visible{outline:2px solid var(--fg);outline-offset:2px}

/* client header */
.client{display:flex;align-items:center;gap:clamp(16px,3vw,26px)}
.logo{flex:0 0 auto;width:clamp(76px,14vw,112px);height:auto;aspect-ratio:1;object-fit:contain;border-radius:50%;background:#000;
  box-shadow:0 0 0 1px var(--line2),0 10px 30px rgba(0,0,0,.5)}
.client > div{display:flex;flex-direction:column;gap:6px;min-width:0}
.client h1{font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:clamp(30px,6vw,52px);line-height:.98;letter-spacing:.005em;text-wrap:balance}
.client p{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg2)}

/* filters */
.filters{display:flex;gap:8px;flex-wrap:wrap}
.chip{all:unset;cursor:pointer;font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg2);
  border:1px solid var(--line2);border-radius:999px;padding:8px 14px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--ink);border-color:var(--fg)}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* delivery groups */
.group{display:flex;flex-direction:column;gap:14px}
.ghead{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg3)}
.ghead b{color:var(--fg);font-weight:500}
.ghead::after{content:"";flex:1;height:1px;background:var(--line)}
.new{font-size:10px;letter-spacing:.16em;color:var(--on-accent);background:var(--accent);border-radius:999px;padding:3px 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:14px}
@media (max-width:520px){.grid{grid-template-columns:1fr 1fr;gap:10px}}
.card{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:8px;min-width:0}
.thumb{position:relative;display:block;width:100%;max-width:100%;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--panel);border:1px solid var(--line)}
.thumb img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .35s ease}
.card:hover .thumb img{transform:scale(1.035)}
.card:focus-visible .thumb{outline:2px solid var(--accent);outline-offset:3px}
.play{position:absolute;inset:auto auto 10px 10px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);color:#fff}
.tag{position:absolute;top:8px;right:8px;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:#fff;background:rgba(0,0,0,.6);border-radius:5px;padding:3px 7px}
.dur{position:absolute;bottom:10px;right:10px;font-family:var(--mono);font-size:11.5px;color:#fff;background:rgba(0,0,0,.6);border-radius:5px;padding:3px 7px;font-variant-numeric:tabular-nums}
.card b{font-weight:600;font-size:15px;line-height:1.3;color:var(--fg)}
.empty{color:var(--fg2);font-size:15px}

/* player sheet */
dialog{border:0;padding:0;margin:auto;background:transparent;color:var(--fg);max-width:min(1000px,100vw);width:100%;max-height:100vh}
dialog::backdrop{background:rgba(4,5,7,.88);backdrop-filter:blur(4px)}
.sheet{display:flex;flex-direction:column;gap:14px;padding:max(14px,env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) max(14px,env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
.stage{background:#000;border-radius:10px;overflow:hidden;display:flex;justify-content:center}
.stage video{display:block;max-width:100%;max-height:calc(100vh - 190px);width:auto;height:auto}
.stage video.wide{width:100%}
.meta{display:flex;justify-content:space-between;align-items:center;gap:12px 20px;flex-wrap:wrap}
.meta > div:first-child{display:flex;flex-direction:column;gap:4px;min-width:0}
.meta h2{font-family:var(--display);font-weight:600;text-transform:uppercase;font-size:clamp(22px,4vw,30px);line-height:1.05}
.meta p{font-family:var(--mono);font-size:12px;color:var(--fg2);letter-spacing:.06em}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:14px;border-radius:999px;padding:10px 16px;border:1px solid var(--line2);color:var(--fg)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn[hidden]{display:none!important}

/* footer */
.foot{display:grid;grid-template-columns:1fr auto;gap:18px 28px;align-items:center;border-top:1px solid var(--line);padding-top:26px}
.foot p{color:var(--fg2);font-size:15px;max-width:52ch}
.foot p b{color:var(--fg);font-weight:600}
.foot .acts{justify-content:flex-end}
.contact{font-family:var(--mono);font-size:13px;color:var(--fg3);display:flex;gap:6px 18px;flex-wrap:wrap}
.contact span{color:var(--fg2)}
@media (max-width:640px){.foot{grid-template-columns:1fr}.foot .acts{justify-content:flex-start}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="mark" href="https://508mediaco.com" target="_blank" rel="noopener" aria-label="508 Media Co."><span>508</span><s>MEDIA CO.</s><i></i></a>
    <a class="dlall" id="dlall" href="#" target="_blank" rel="noopener" hidden>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m0 0-5-5m5 5 5-5M4 21h16"/></svg>
      Download all
    </a>
  </header>

  <section class="client">
    <img class="logo" id="logo" alt="" hidden>
    <div><h1 id="cname"></h1><p id="count"></p></div>
  </section>

  <div class="filters" id="filters" role="group" aria-label="Show videos" hidden>
    <button class="chip" type="button" data-f="all" aria-pressed="true">All</button>
    <button class="chip" type="button" data-f="tall" aria-pressed="false">Phone · 9:16</button>
    <button class="chip" type="button" data-f="wide" aria-pressed="false">Widescreen · 16:9</button>
  </div>

  <main id="lib"></main>

  <footer class="foot">
    <p>Need a file re-sent or a different size? <b>Text Drew</b> anytime. Know a business that needs video? Send them my way and get <b>$50 off</b> your next one.</p>
    <div class="acts">
      <a class="btn primary" href="https://g.page/r/CQRtijkKqWhOEBI/review" target="_blank" rel="noopener">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3 6.1 20.6l1.3-6.6L2.5 9.4l6.6-.8z"/></svg>
        Leave a review
      </a>
    </div>
    <div class="contact"><span>Drew Reid · 508 Media Co.</span><span>(864) 915-4071</span><span>drew@508mediaco.com</span></div>
  </footer>
</div>

<dialog id="player" aria-labelledby="ptitle">
  <div class="sheet">
    <div class="stage"><video id="pv" controls playsinline preload="metadata"></video></div>
    <div class="meta">
      <div><h2 id="ptitle"></h2><p id="pmeta"></p></div>
      <div class="acts">
        <a class="btn primary" id="pdl" target="_blank" rel="noopener">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m0 0-5-5m5 5 5-5M4 21h16"/></svg>
          Download
        </a>
        <button class="btn" id="pprev" type="button" aria-label="Previous video">‹</button>
        <button class="btn" id="pnext" type="button" aria-label="Next video">›</button>
        <button class="btn" id="pclose" type="button">Close</button>
      </div>
    </div>
  </div>
</dialog>

<script>
var DATA = {"name": "Naked Metal Fabrication", "logo": "logo.webp", "drive": "", "updated": "2026-11-09", "videos": [{"id": "bryson-and-cade", "title": "Bryson and Cade", "date": "2026-11-09", "order": 0, "src": "media/the-hype-cut.mp4", "poster": "media/the-hype-cut.jpg", "w": 3840, "h": 2160, "dur": 23.43}]};
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var PLAY = '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>';
  var fmtDur = function(s){ s = Math.round(s); return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); };
  var fmtDate = function(d){ var p = d.split('-'); return new Date(+p[0], +p[1]-1, +p[2]).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); };
  var esc = function(t){ var e = document.createElement('i'); e.textContent = t; return e.innerHTML; };

  document.title = DATA.name + ' · Video Library';
  $('cname').textContent = DATA.name;
  if (DATA.logo) { $('logo').src = DATA.logo; $('logo').alt = DATA.name + ' logo'; $('logo').hidden = false; }
  if (DATA.drive) { $('dlall').href = DATA.drive; $('dlall').hidden = false; }
  var vids = DATA.videos.slice().sort(function(a,b){ return a.date < b.date ? 1 : a.date > b.date ? -1 : a.order - b.order; });
  $('count').textContent = vids.length + (vids.length === 1 ? ' video' : ' videos') + ' · updated ' + fmtDate(vids.length ? vids[0].date : DATA.updated);
  var hasTall = vids.some(function(v){ return v.h > v.w; }), hasWide = vids.some(function(v){ return v.w >= v.h; });
  if (hasTall && hasWide) $('filters').hidden = false;

  var filter = 'all', shown = [];
  function render(){
    var lib = $('lib'), html = '', groups = [], by = {};
    shown = vids.filter(function(v){ return filter === 'all' || (filter === 'tall') === (v.h > v.w); });
    shown.forEach(function(v){ if (!by[v.date]) { by[v.date] = []; groups.push(v.date); } by[v.date].push(v); });
    groups.forEach(function(d, gi){
      html += '<section class="group"><div class="ghead"><b>' + fmtDate(d) + '</b>' + by[d].length + (by[d].length === 1 ? ' video' : ' videos') +
              (gi === 0 && d === vids[0].date ? '<span class="new">New</span>' : '') + '</div><div class="grid">';
      by[d].forEach(function(v){
        var i = shown.indexOf(v);
        html += '<button class="card" type="button" data-i="' + i + '" aria-label="Play ' + esc(v.title) + '">' +
          '<span class="thumb"><img src="' + v.poster + '" alt="" loading="lazy" width="720" height="720">' +
          '<span class="tag">' + (v.h > v.w ? '9:16' : '16:9') + '</span><span class="play">' + PLAY + '</span><span class="dur">' + fmtDur(v.dur) + '</span></span>' +
          '<b>' + esc(v.title) + '</b></button>';
      });
      html += '</div></section>';
    });
    lib.style.display = 'flex'; lib.style.flexDirection = 'column'; lib.style.gap = '34px';
    lib.innerHTML = html || '<p class="empty">No videos in this view yet.</p>';
  }
  render();

  document.querySelectorAll('.chip').forEach(function(c){
    c.addEventListener('click', function(){
      filter = c.dataset.f;
      document.querySelectorAll('.chip').forEach(function(o){ o.setAttribute('aria-pressed', o === c ? 'true' : 'false'); });
      render();
    });
  });

  var dlg = $('player'), pv = $('pv'), cur = -1;
  function open(i){
    cur = (i + shown.length) % shown.length; var v = shown[cur];
    pv.className = v.w >= v.h ? 'wide' : '';
    pv.poster = v.poster; pv.src = v.src;
    $('ptitle').textContent = v.title;
    $('pmeta').textContent = fmtDate(v.date) + ' · ' + (v.h > v.w ? 'Phone 9:16' : 'Widescreen 16:9') + ' · ' + fmtDur(v.dur);
    var dl = v.download || DATA.drive;
    if (dl) { $('pdl').href = dl; $('pdl').hidden = false; } else { $('pdl').hidden = true; }
    $('pprev').hidden = $('pnext').hidden = shown.length < 2;
    if (!dlg.open) dlg.showModal();
    if (location.hash !== '#' + v.id) history.replaceState(null, '', '#' + v.id);
    pv.play().catch(function(){});
  }
  function close(){ pv.pause(); pv.removeAttribute('src'); pv.load(); if (dlg.open) dlg.close(); history.replaceState(null, '', location.pathname); }
  $('lib').addEventListener('click', function(e){ var c = e.target.closest('.card'); if (c) open(+c.dataset.i); });
  $('pclose').addEventListener('click', close);
  $('pprev').addEventListener('click', function(){ open(cur - 1); });
  $('pnext').addEventListener('click', function(){ open(cur + 1); });
  dlg.addEventListener('cancel', function(e){ e.preventDefault(); close(); });
  dlg.addEventListener('click', function(e){ if (e.target === dlg) close(); });
  document.addEventListener('keydown', function(e){
    if (!dlg.open) return;
    if (e.key === 'ArrowRight') open(cur + 1); else if (e.key === 'ArrowLeft') open(cur - 1);
  });
  var h = location.hash.slice(1);
  if (h) { var i = shown.findIndex(function(v){ return v.id === h; }); if (i >= 0) open(i); }
})();
</script>
</body>
</html>
